name: vidhya
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management & Storage
  shared_preferences: ^2.2.2  # For session/auth storage (replaces sessionStorage)
  
  # HTTP & API
  http: ^1.2.0
  
  # Supabase (if you're using it)
  supabase_flutter: ^2.5.0
  
  # UI & Utilities
  intl: ^0.19.0  # For date formatting
  url_launcher: ^6.2.5  # For opening URLs
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/